name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        if: runner.os == 'Linux'
        run: shellcheck clacc install.sh tests/*.sh tests/stub/*
      - name: Test
        run: tests/run.sh
      - name: Check that the tests catch each broken safeguard
        run: tests/mutants.sh
